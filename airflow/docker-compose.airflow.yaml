# Minimal standalone Airflow stack for the cocktail ingestion pipeline.
# Runs webserver + scheduler in a single container using `airflow standalone`.
#
# Start:  docker-compose -f airflow/docker-compose.airflow.yaml up
# UI:     http://localhost:8080  (login: admin / admin)
#
# After the DAG runs, data/cocktails.csv is written into the project's data/ folder.

services:
  airflow:
    image: apache/airflow:2.9.3
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ../data:/opt/airflow/data
    command: standalone
